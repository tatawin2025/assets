<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienvenue chez Tatawin</title>
<style>
  :root{
    --bg:#edf2f5; --card:#ffffff; --card-2:#f3f7f9;
    --ink:#16202e; --muted:#5b6a78; --faint:#93a2af; --line:#dbe4ea;
    --teal:#2b73a6; --teal-d:#1e3543; --teal-soft:#e4eef6;
    --amber:#c2760a; --amber-soft:#fbeecf;
    --blue:#2563eb; --green:#15a34a; --green-soft:#dcf4e4;
    --shadow:0 1px 2px rgba(18,34,32,.05),0 12px 34px rgba(18,34,32,.09);
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0d1a22; --card:#12232e; --card-2:#0f1e28;
    --ink:#e9f1f6; --muted:#94a6b2; --faint:#6d818e; --line:#24353f;
    --teal:#6fb0df; --teal-d:#3f7ba6; --teal-soft:#103042;
    --amber:#f4b53f; --amber-soft:#33280f;
    --blue:#6ea6ff; --green:#4ade80; --green-soft:#123324;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.45);
  }}
  :root[data-theme="dark"]{
    --bg:#0d1a22; --card:#12232e; --card-2:#0f1e28;
    --ink:#e9f1f6; --muted:#94a6b2; --faint:#6d818e; --line:#24353f;
    --teal:#6fb0df; --teal-d:#3f7ba6; --teal-soft:#103042;
    --amber:#f4b53f; --amber-soft:#33280f;
    --blue:#6ea6ff; --green:#4ade80; --green-soft:#123324;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
    display:grid;place-items:start center;padding:clamp(14px,3vw,40px)}
  .app{width:100%;max-width:940px;background:var(--card);border:1px solid var(--line);
    border-radius:22px;box-shadow:var(--shadow);overflow:hidden}

  /* Top bar */
  .top{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--round);font-weight:800;letter-spacing:-.01em}
  .brand svg{display:block}
  .tmark{width:27px;height:27px;border-radius:7px;background:#0d0d0f;color:#fff;display:grid;place-items:center;
    font-family:var(--round);font-weight:800;font-size:1rem}
  .progresswrap{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:0}
  .pcount{font-size:.78rem;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pbar{width:clamp(90px,22vw,220px);height:7px;border-radius:99px;background:var(--card-2);overflow:hidden;border:1px solid var(--line)}
  .pbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal-d));
    border-radius:99px;transition:width .45s cubic-bezier(.3,.8,.3,1)}

  /* Body layout */
  .body{display:grid;grid-template-columns:230px 1fr;min-height:440px}
  @media(max-width:720px){.body{grid-template-columns:1fr}}

  /* Stepper */
  .stepper{border-right:1px solid var(--line);padding:16px 12px;background:var(--card-2);display:flex;flex-direction:column;gap:2px}
  @media(max-width:720px){.stepper{display:none}}
  .snav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;font-size:.86rem;
    font-weight:600;color:var(--muted);cursor:pointer;border:1px solid transparent;text-align:left;background:none;font-family:var(--sans)}
  .snav:hover{background:var(--card)}
  .snav .sdot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;
    font-size:.72rem;font-weight:800;font-family:var(--round);background:var(--card);border:1px solid var(--line);color:var(--faint)}
  .snav[data-state="active"]{background:var(--card);color:var(--ink);border-color:var(--line)}
  .snav[data-state="active"] .sdot{background:var(--teal);border-color:var(--teal);color:#fff}
  .snav[data-state="done"] .sdot{background:var(--green);border-color:var(--green);color:#fff}
  .snav[data-state="done"]{color:var(--ink)}

  /* Panel */
  .panel{padding:clamp(22px,3.4vw,40px);display:flex;flex-direction:column}
  .eyebrow{font-family:var(--round);font-weight:800;font-size:.72rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--teal);margin:0 0 10px}
  h1{font-family:var(--round);font-weight:800;font-size:clamp(1.5rem,3.6vw,2.15rem);line-height:1.06;
    letter-spacing:-.02em;margin:0;text-wrap:balance}
  .intro{color:var(--muted);font-size:1rem;margin:12px 0 0;max-width:52ch}
  .todo{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
  .todo li{display:flex;gap:11px;align-items:flex-start;font-size:.95rem}
  .todo .b{width:22px;height:22px;border-radius:7px;flex:none;display:grid;place-items:center;
    background:var(--teal-soft);color:var(--teal);font-weight:800;font-size:.75rem;font-family:var(--round);margin-top:1px}
  .todo li b{font-weight:680}
  .todo code{font-family:var(--mono);font-size:.85em;background:var(--card-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .lnk{color:var(--teal);font-weight:700;font-family:var(--mono);font-size:.9em;text-decoration:underline;text-underline-offset:2px}
  .lnk:hover{opacity:.75}
  .lnk:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:3px}
  .names{display:inline-block;margin-top:8px;background:var(--teal-soft);border:1px solid var(--line);border-radius:9px;
    padding:9px 13px;font-weight:700;line-height:1.9;color:var(--ink)}
  .tlink{color:var(--teal);font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .tlink:hover{opacity:.75}

  .callout{margin-top:18px;display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:12px;
    background:var(--amber-soft);font-size:.87rem;color:var(--ink)}
  .callout.info{background:var(--teal-soft)}
  .callout .ci{font-family:var(--round);font-weight:800;color:var(--amber);flex:none}
  .callout.info .ci{color:var(--teal)}

  /* Mockups */
  .mock{margin-top:22px;background:var(--card-2);border:1px solid var(--line);border-radius:16px;
    padding:20px;display:grid;place-items:center;min-height:150px}
  .win{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
    width:100%;max-width:330px;overflow:hidden}
  .win .bar{display:flex;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--card-2)}
  .win .bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
  .win .in{padding:16px}
  .field{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--card-2);
    display:flex;align-items:center;padding:0 10px;font-size:.8rem;color:var(--muted);margin-bottom:9px}
  .btnmock{height:34px;border-radius:8px;background:var(--teal);color:#fff;display:grid;place-items:center;
    font-family:var(--round);font-weight:700;font-size:.82rem}
  .btnmock.google{background:#fff;color:#3c4043;border:1px solid #dadce0;gap:9px;display:flex;align-items:center;justify-content:center}
  .gG{width:15px;height:15px;flex:none}
  .otp{display:flex;gap:7px;justify-content:center;margin-top:4px}
  .otp span{width:26px;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--card-2);
    display:grid;place-items:center;font-family:var(--round);font-weight:800;color:var(--teal)}
  /* Reproduction écran de connexion Google (toujours clair, fidèle à Google) */
  .gwrap{background:#f0f3fb;border:1px solid #e2e7f3;padding:20px}
  .gcard{background:#fff;border:1px solid #dadce0;border-radius:14px;padding:28px 30px 20px;width:100%;max-width:580px;
    color:#202124;font-family:Roboto,Arial,var(--sans);box-shadow:0 1px 3px rgba(60,64,67,.12)}
  .gcard .grid{display:grid;grid-template-columns:1fr 1.1fr;gap:32px;align-items:start}
  .gcard .gh{font-size:1.55rem;font-weight:400;margin-top:14px;color:#202124;line-height:1.15}
  .gcard .gsub{font-size:.92rem;color:#202124;margin-top:6px}
  .gcard .gfield{border:1px solid #757575;border-radius:5px;padding:12px 14px;color:#5f6368;font-size:.86rem}
  .gcard .glink2{display:inline-block;color:#1a73e8;font-weight:600;font-size:.8rem;text-decoration:none;margin-top:12px;white-space:nowrap}
  .gcard .grow{display:flex;align-items:center;justify-content:flex-end;gap:20px;margin-top:38px}
  .gcard .gbtn{background:#1a73e8;color:#fff;border-radius:20px;padding:9px 22px;font-size:.85rem;font-weight:600}
  .gcard .gfoot{display:flex;justify-content:space-between;gap:12px;margin-top:16px;
    font-size:.72rem;color:#5f6368;flex-wrap:wrap}
  @media(max-width:560px){.gcard .grid{grid-template-columns:1fr;gap:10px}.gcard{max-width:400px}}
  /* Reproduction formulaire « Nouvel élément / Connexion » 1Password */
  .npcard{background:#f0f0f4;border:1px solid #e0e0ea;border-radius:14px;width:100%;max-width:420px;overflow:hidden;
    font-family:var(--sans);color:#1d1d2b;box-shadow:0 1px 3px rgba(29,29,43,.14)}
  .npcard .nphead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#f6f6fa;border-bottom:1px solid #e6e6ef}
  .npcard .nphead b{font-family:var(--round);font-weight:800;font-size:.95rem}
  .npcard .nphead i{color:#8a8a99;font-size:1rem;font-style:normal}
  .npcard .npbody{padding:16px}
  .npcard .nptype{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .npcard .nptype .ic{width:40px;height:40px;border-radius:10px;background:#12726e;display:grid;place-items:center;flex:none}
  .npcard .nptype .lbl{flex:1;background:#e9e9f0;border-radius:8px;padding:12px 14px;font-family:var(--round);font-weight:800;font-size:1rem}
  .npcard .npfields{background:#fff;border:1px solid #e6e6ef;border-radius:10px;overflow:hidden;margin-bottom:12px}
  .npcard .npf{padding:9px 14px}
  .npcard .npf+.npf{border-top:1px solid #efeff3}
  .npcard .npf .k{color:#6c74f8;font-size:.72rem;font-weight:600}
  .npcard .npf .v{font-size:.9rem;margin-top:3px;display:flex;align-items:center;justify-content:space-between;gap:8px;letter-spacing:.02em}
  .npcard .npgen{color:#3b5bfd;font-size:.68rem;font-weight:700;border:1px solid #d6d8fb;border-radius:6px;padding:3px 8px;flex:none;background:#f2f3ff}
  .npcard .nprow{background:#e9e9f0;border-radius:9px;padding:10px 14px;font-size:.82rem;margin-bottom:9px;color:#5a5a6a}
  .npcard .nprow .k{color:#1d1d2b;font-size:.76rem;margin-bottom:1px}
  .npcard .nplink{color:#3b5bfd;font-weight:600;font-size:.8rem;margin:2px 2px 10px;display:inline-block}
  .npcard .npfoot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 16px;border-top:1px solid #e6e6ef;background:#f6f6fa}
  .npcard .npvault{display:flex;align-items:center;gap:6px;font-size:.76rem;color:#5a5a6a;border:1px solid #e0e0ea;border-radius:8px;padding:5px 10px;background:#fff}
  .npcard .npsave{background:#3b5bfd;color:#fff;border-radius:8px;padding:8px 18px;font-size:.85rem;font-weight:700}
  /* Reproduction écran de connexion Tatawin */
  .twcard{background:#fff;border:1px solid #ececf2;border-radius:18px;padding:26px 28px;width:100%;max-width:380px;
    color:#1d2530;font-family:var(--sans);box-shadow:0 1px 3px rgba(29,37,48,.12);text-align:center}
  .twcard .twlogo{width:52px;height:52px;border-radius:12px;background:#111;color:#fff;display:grid;place-items:center;
    font-family:var(--round);font-weight:800;font-size:1.4rem;margin:0 auto 16px}
  .twcard .twh{font-family:var(--round);font-weight:800;font-size:1.3rem;letter-spacing:-.01em}
  .twcard .twsub{color:#6b7684;font-size:.85rem;margin:8px 0 18px}
  .twcard .twbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .twcard .twb{border:1px solid #dfe3ea;border-radius:26px;padding:11px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:.86rem}
  .twcard .twor{display:flex;align-items:center;gap:12px;color:#9aa3af;font-size:.76rem;font-weight:700;margin:16px 0}
  .twcard .twor::before,.twcard .twor::after{content:"";height:1px;background:#e6e9ef;flex:1}
  .twcard .twlabel{text-align:left;font-weight:700;font-size:.88rem;margin-bottom:7px}
  .twcard .twfield{text-align:left;border:1px solid #dfe3ea;border-radius:24px;padding:12px 18px;color:#9aa3af;font-size:.85rem;margin-bottom:14px;min-height:44px}
  .twcard .twsubmit{background:#5b9bd5;color:#fff;border-radius:26px;padding:13px;font-weight:700;font-size:.9rem}
  .twcard .twforgot{color:#6b7684;font-weight:700;font-size:.8rem;margin-top:16px}
  /* Reproduction fenêtre « Create Profile » Dia */
  .dpcard{background:#fff;border:1px solid #e6e6ef;border-radius:16px;padding:22px;width:100%;max-width:400px;color:#1d1d2b;
    font-family:var(--sans);box-shadow:0 1px 3px rgba(29,29,43,.14);text-align:left}
  .dpcard h4{font-family:var(--round);font-weight:800;font-size:1.1rem;margin:0 0 6px}
  .dpcard .dpsub{color:#6b7280;font-size:.78rem;margin-bottom:16px;line-height:1.45}
  .dpcard .dplabel{font-weight:700;font-size:.84rem;margin-bottom:7px}
  .dpcard .dpinput{border:1.5px solid #6c74f8;border-radius:9px;padding:11px 13px;color:#9aa3af;font-size:.85rem;margin-bottom:16px}
  .dpcard .dpcolors{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap}
  .dpcard .dpc{width:26px;height:26px;border-radius:50%}
  .dpcard .dpc.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px #16a34a}
  .dpcard .dpshare{display:flex;align-items:center;justify-content:space-between;background:#f2f2f6;border-radius:10px;padding:11px 14px;font-size:.82rem;color:#5a5a6a;margin-bottom:16px}
  .dpcard .dptoggle{width:34px;height:20px;border-radius:12px;background:#d0d0da;position:relative;flex:none}
  .dpcard .dptoggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff}
  .dpcard .dpbtns{display:flex;align-items:center;justify-content:space-between}
  .dpcard .dpcancel{color:#5a5a6a;font-size:.84rem;font-weight:600;border:1px solid #e0e0ea;border-radius:8px;padding:8px 14px}
  .dpcard .dpcreate{background:#1a1a22;color:#fff;font-size:.84rem;font-weight:700;border-radius:8px;padding:9px 16px}
  .wifi{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:14px 18px;box-shadow:var(--shadow)}
  .wifi .name{font-family:var(--mono);font-weight:600}
  .wifi .ok{margin-left:8px;color:var(--green);font-weight:800;font-family:var(--round)}
  .term{background:#0d1a18;border-radius:12px;width:100%;max-width:360px;overflow:hidden;box-shadow:var(--shadow);border:1px solid #1f2f2c}
  .term .bar{background:#12211e;border-bottom:1px solid #1f2f2c}
  .term .in{padding:14px 16px;font-family:var(--mono);font-size:.8rem;color:#cfeee7;line-height:1.7}
  .term .p{color:#2dd4bf}
  .profiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .pf{width:52px;text-align:center}
  .pf .av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;
    font-family:var(--round);font-weight:800;margin:0 auto 6px;box-shadow:var(--shadow)}
  .pf small{font-size:.66rem;color:var(--muted)}
  .lock{width:60px;height:60px;border-radius:16px;background:var(--blue);display:grid;place-items:center;box-shadow:var(--shadow)}

  .hero-badge{width:74px;height:74px;border-radius:20px;background:#0d0d0f;
    display:grid;place-items:center;box-shadow:var(--shadow);margin-bottom:20px}
  .done-check{width:96px;height:96px;border-radius:50%;background:var(--green);display:grid;place-items:center;
    margin:6px auto 20px;box-shadow:var(--shadow)}
  .recap{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px;max-width:360px}
  .recap li{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
  .recap .ck{width:20px;height:20px;border-radius:6px;background:var(--green-soft);color:var(--green);
    display:grid;place-items:center;font-weight:800;font-size:.72rem;flex:none}

  /* Footer nav */
  .nav{display:flex;align-items:center;gap:12px;padding:16px 22px;border-top:1px solid var(--line);background:var(--card)}
  button.btn{font-family:var(--round);font-weight:700;font-size:.92rem;border-radius:11px;padding:11px 20px;
    cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:transform .1s ease}
  button.btn:hover{transform:translateY(-1px)}
  button.btn:active{transform:translateY(0)}
  button.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;margin-left:auto}
  button.btn.ghost{color:var(--muted)}
  button.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  button.btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  .step-tag{font-size:.78rem;color:var(--faint);font-weight:600}

  @media(prefers-reduced-motion:no-preference){
    .panel > *{animation:fade .4s ease both}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
</style>

<div class="app">
  <div class="top">
    <span class="brand">
      <span class="tmark">T</span>
      Tatawin
    </span>
    <div class="progresswrap">
      <span class="pcount" id="pcount">1 / 8</span>
      <div class="pbar"><i id="pbar"></i></div>
    </div>
  </div>

  <div class="body">
    <nav class="stepper" id="stepper" aria-label="Étapes"></nav>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>

  <div class="nav">
    <button class="btn ghost" id="back">← Retour</button>
    <span class="step-tag" id="steptag"></span>
    <button class="btn primary" id="next">Continuer →</button>
  </div>
</div>

<script>
(function(){
  var CK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4L19 6" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

</b> pour afficher la <b>clé de configuration</b>, et copie-la. Dans 1Password, rouvre ton élément Google → <b>Modifier</b> → clique <b>« + ajouter plus »</b> → choisis <b>« Mot de passe à usage unique »</b> → colle la clé. 1Password affiche alors un <b>code à 6 chiffres</b> : saisis-le côté Google pour valider.']],

    h+='<h1>'+st.title+'</h1>';
    if(st.intro) h+='<p class="intro">'+st.intro+'</p>';
    if(st.list){ h+='<ul class="todo">'; st.list.forEach(function(it){ h+='<li><span class="b">'+it[0]+'</span><span>'+it[1]+'</span></li>'; }); h+='</ul>'; }
    if(st.recap){ h+='<ul class="recap">'; st.recap.forEach(function(r){ h+='<li><span class="ck">'+CK+'</span>'+r+'</li>'; }); h+='</ul>'; }
    if(st.mock) h+=st.mock();
    if(st.callout) h+='<div class="callout '+(st.callout.type==='info'?'info':'')+'"><span class="ci">'+(st.callout.k==='!'?'!':'i')+'</span><span>'+st.callout.txt+'</span></div>';
    panel.innerHTML=h;

    pbar.style.width=((i)/(steps.length-1)*100)+'%';
    pcount.textContent=(i+1)+' / '+steps.length;
    back.style.visibility = i===0?'hidden':'visible';
    steptag.textContent = st.kind==='welcome'?'Prêt à démarrer ?':(st.kind==='done'?'':'Étape '+i+' sur '+(steps.length-2));
    next.textContent = st.kind==='welcome'?'C\'est parti →':(st.kind==='done'?'Recommencer':(st.passive?'Continuer →':(i===steps.length-2?'J\'ai fini →':'C\'est fait →')));
    if(st.kind==='done'){ next.classList.remove('primary'); next.classList.add('ghost'); } else { next.classList.add('primary'); next.classList.remove('ghost'); }
    renderStepper(); save();
  }

  back.onclick=function(){ if(i>0){ i--; render(); } };
  next.onclick=function(){
    var st=steps[i];
    if(st.kind==='done'){ i=0; done={}; render(); return; }
    done[i]=true;
    if(i<steps.length-1){ i++; } render();
  };
  document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight') next.click(); if(e.key==='ArrowLeft') back.click(); });

  render();
})();
</script>
